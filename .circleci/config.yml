version: 2.1

filters: &all_tags
  tags:
    only: /.*/
  branches:
    ignore: gh-pages

run: &DOCKER_TAGS
    name: Generate image tag
    command: |
        set -x
        if [ -n "$CIRCLE_TAG" ]; then
            DOCKER_TAG="$CIRCLE_TAG"
        elif [ "$CIRCLE_BRANCH" == "master" ]; then
            DOCKER_TAG="${CIRCLE_SHA1:0:7}"
        else
            DOCKER_TAG=`echo $CIRCLE_BRANCH | sed 's,/,_,g'`
        fi
        env | sort
        echo "export DOCKER_TAG=$DOCKER_TAG" >> $BASH_ENV
        echo "export DOCKER_IMAGE=mongoose-push" >> $BASH_ENV

executors:
  elixir-builder: &elixir-builder
    parameters:
      erlang_version:
        type: string
        default: "29.0.6"
      elixir_version:
        type: string
        default: "1.20.4"
      env:
        type: string
        default: test
    docker:
      - image: hexpm/elixir:<< parameters.elixir_version >>-erlang-<< parameters.erlang_version >>-debian-bookworm-20260824
    working_directory: ~/app
    environment:
        MIX_ENV: << parameters.env >>
  elixir-env:
    <<: *elixir-builder
    docker:
      - image: hexpm/elixir:<< parameters.elixir_version >>-erlang-<< parameters.erlang_version >>-debian-bookworm-20260824
      - image: erlangsolutions/fcm-mock-server
      - image: erlangsolutions/apns-mock-server

commands:
  test:
    steps:
      - run:
          name: Install deps
          command: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y git netcat-openbsd openssh-client
      - checkout
      - restore_cache:
          keys:
            - mix-cache-{{ .Environment.CACHE_VERSION }}-{{ .Branch }}-{{ .Revision }}
      - restore_cache:
          keys:
            - build-${CIRCLE_JOB}-cache-{{ .Environment.CACHE_VERSION }}-{{ .Branch }}-{{ .Revision }}
      - run:
          name: Wait for FCM mock
          command: timeout 60 bash -c 'until nc -z localhost 4000; do sleep 5; done'
      - run:
          name: Wait for APNS mock
          command: timeout 60 bash -c 'until nc -z localhost 2197; do sleep 5; done'

      - run:
          name: Install Hex and Rebar
          command: mix do local.hex --force + local.rebar --force
      - run: MIX_ENV=test mix do certs.dev + coveralls.circle

      - save_cache:
          key: build-${CIRCLE_JOB}-cache-{{ .Environment.CACHE_VERSION }}-{{ .Branch }}-{{ .Revision }}
          paths:
            - "_build"
      - store_artifacts:
          path: cover
          destination: coverage_results
  install_deps:
    steps:
      - run:
          name: Install deps
          command: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y git openssh-client
  install_docker:
    steps:
      - run:
          name: Install docker repository key
          command: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y ca-certificates curl
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
      - run:
          name: Add docker repository
          command: |
            tee /etc/apt/sources.list.d/docker.sources \<<EOF
            Types: deb
            URIs: https://download.docker.com/linux/debian
            Suites: $(. /etc/os-release && echo "$VERSION_CODENAME")
            Components: stable
            Signed-By: /etc/apt/keyrings/docker.asc
            EOF
            apt-get update
      - run:
          name: Install docker and plugins
          command: DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

jobs:
  pre-build:
    executor: elixir-builder

    steps:
      - install_deps
      - checkout
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - run: echo "$OTP_VERSION $ELIXIR_VERSION" > .version_file
      - save_cache:
          key: mix-cache-{{ .Environment.CACHE_VERSION }}-{{ .Branch }}-{{ .Revision }}
          paths:
                - deps
                - ~/.mix


  dialyzer:
    executor: elixir-builder
    steps:
      - install_deps
      - checkout
      - run: echo "$OTP_VERSION $ELIXIR_VERSION" > .version_file
      - restore_cache:
          keys:
            - mix-cache-{{ .Environment.CACHE_VERSION }}-{{ .Branch }}-{{ .Revision }}
      - restore_cache:
          keys:
            - plt-cache-{{ .Environment.CACHE_VERSION }}-{{ checksum ".version_file" }}-{{ checksum "mix.lock" }}
            - plt-cache-{{ .Environment.CACHE_VERSION }}-{{ checksum ".version_file"  }}
      - run: mix dialyzer --plt
      - save_cache:
          key: plt-cache-{{ .Environment.CACHE_VERSION }}-{{ checksum ".version_file"  }}-{{ checksum "mix.lock" }}
          paths:
            - .dialyzer
            - _build
      - save_cache:
          key: plt-cache-{{ .Environment.CACHE_VERSION }}-{{ checksum ".version_file"  }}
          paths:
            - .dialyzer
      - run:
          name: Execute dialyzer
          command: mix deps.get && mix dialyzer --halt-exit-status

  build-dev-certs:
    executor:
      name: elixir-builder
      env: dev
    steps:
      - install_deps
      - checkout
      - restore_cache:
          keys:
            - mix-cache-{{ .Environment.CACHE_VERSION }}-{{ .Branch }}-{{ .Revision }}
      - restore_cache:
          keys:
            - build-${CIRCLE_JOB}-cache-{{ .Environment.CACHE_VERSION }}-{{ .Branch }}-{{ .Revision }}
      - run:
          name: Generate dev certs
          command: mix certs.dev
      - save_cache:
          key: certs-cache-{{ .Environment.CACHE_VERSION }}-{{ .Branch }}-{{ .Revision }}
          paths:
            - priv

  test-erlang-28_elixir-1-19:
    executor:
      name: elixir-env
      env: test
      erlang_version: "28.5.0.5"
      elixir_version: "1.19.5"
    steps:
      - test

  test-erlang-29_elixir-1-20:
    executor:
      name: elixir-env
      env: test
      erlang_version: "29.0.6"
      elixir_version: "1.20.4"
    steps:
      - test

  format_check:
    executor:
      name: elixir-builder
    steps:
      - install_deps
      - checkout
      - restore_cache:
          keys:
            - mix-cache-{{ .Environment.CACHE_VERSION }}-{{ .Branch }}-{{ .Revision }}
      - run: mix format --check-formatted

  build-docker-image:
    executor:
      name: elixir-builder
      env: prod
    steps:
      - install_deps
      - checkout
      - install_docker
      - setup_remote_docker:
          docker_layer_caching: true
      - restore_cache:
          keys:
            - mix-cache-{{ .Environment.CACHE_VERSION }}-{{ .Branch }}-{{ .Revision }}
      - run: *DOCKER_TAGS
      - run:
          name: Login to DockerHub
          command: docker login -u "${DOCKERHUB_USER}" -p "${DOCKERHUB_PASS}"
      - run:
          name: Build docker image
          command: |
            docker run --privileged --rm tonistiigi/binfmt --install all
            docker buildx create --name builder --driver docker-container --bootstrap --use
            docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile --build-arg MIX_ENV=prod -t $DOCKERHUB_ORG/$DOCKER_IMAGE:$DOCKER_TAG --push .

  integration-tests:
    machine:
      image: ubuntu-2404:current
    environment:
      MPUSH_ELIXIR_IMAGE: hexpm/elixir:1.20.4-erlang-29.0.6-debian-bookworm-20260824
    steps:
      - checkout
      - run:
          name: Start Elixir environment
          command: |
            docker run --detach --rm \
              --name mongoose-push-elixir \
              --network host \
              --volume "$PWD:/app" \
              --workdir /app \
              --env MIX_ENV=integration \
              "$MPUSH_ELIXIR_IMAGE" \
              sleep infinity
      - restore_cache:
          keys:
              - mix-cache-{{ .Environment.CACHE_VERSION }}-{{ .Branch }}-{{ .Revision }}
      - restore_cache:
          keys:
              - certs-cache-{{ .Environment.CACHE_VERSION }}-{{ .Branch }}-{{ .Revision }}
      - run: *DOCKER_TAGS
      - run:
          name: Prepare integration tests
          command: |
            docker exec mongoose-push-elixir bash -lc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y git
              mix local.hex --force
              mix local.rebar --force
              mix deps.get
              mix deps.compile
              mix certs.dev
            '
      - run:
          name: Setup MongoosePush and mocks
          command: |
            PRIV=../../priv docker compose \
              -f test/docker/docker-compose.mocks.yml \
              -f test/docker/docker-compose.mpush.yml \
              up --build -d --remove-orphans
      - run:
          name: Wait for MongoosePush and mocks
          command: docker exec mongoose-push-elixir mix test.env.wait 60000
      - run:
          name: Run integration tests
          command: docker exec mongoose-push-elixir mix test
      - run:
          name: Stop Elixir environment
          when: always
          command: |
            if docker inspect mongoose-push-elixir >/dev/null 2>&1; then
              docker stop mongoose-push-elixir
            fi

  push-to-dockerhub:
    executor:
      name: elixir-builder
      env: prod
    steps:
      - install_deps
      - checkout
      - install_docker
      - setup_remote_docker:
          docker_layer_caching: true
      - run: *DOCKER_TAGS
      - run:
          name: Login to DockerHub
          command: docker login -u "${DOCKERHUB_USER}" -p "${DOCKERHUB_PASS}"
      - run:
          name: Tag and push docker image
          command: |
             set -x
             if [ "$CIRCLE_BRANCH" == "master" ]; then
               docker buildx imagetools create --tag $DOCKERHUB_ORG/$DOCKER_IMAGE:latest $DOCKERHUB_ORG/$DOCKER_IMAGE:$DOCKER_TAG
             fi

  gh-pages-deploy:
    docker:
      - image: hexpm/elixir:1.20.4-erlang-29.0.6-debian-bookworm-20260824
    steps:
      - install_deps
      - checkout
      - restore_cache:
          keys:
              - mix-cache-{{ .Environment.CACHE_VERSION }}-{{ .Branch }}-{{ .Revision }}
      - restore_cache:
          keys:
              - certs-cache-{{ .Environment.CACHE_VERSION }}-{{ .Branch }}-{{ .Revision }}
      - run: mix local.hex --force && mix local.rebar --force
      - run:
          name: Compile mix deps
          command: mix do deps.get + deps.compile
      - run:
          name: Configure Git
          command: |
              git config --global user.email "mongoosepushbot@erlang-solutions.com"
              git config --global user.name "mongoosepushbot"
      - add_ssh_keys
      - run:
          name: Generate docs
          command: |
              set -x
              if [ -n "$CIRCLE_TAG" ]; then
                  mix gh_pages_docs $CIRCLE_TAG
              elif [ "$CIRCLE_BRANCH" == "master" ]; then
                  mix gh_pages_docs latest
              else
                  mix gh_pages_docs dry
              fi


workflows:
  version: 2
  build_and_test:
    jobs:
      - pre-build:
          filters: *all_tags

      - format_check:
          requires:
            - pre-build
          filters: *all_tags
      - dialyzer:
          requires:
            - pre-build
          filters: *all_tags
      - test-erlang-28_elixir-1-19:
          name: elixir-1.19.5-otp-28.5.0.5
          requires:
            - pre-build
          filters: *all_tags
      - test-erlang-29_elixir-1-20:
          name: elixir-1.20.4-otp-29.0.6
          requires:
            - pre-build
          filters: *all_tags
      - build-docker-image:
          requires:
            - pre-build
          filters: *all_tags

      - integration-tests:
          requires:
            - pre-build
          filters: *all_tags

      - push-to-dockerhub:
          requires:
            - integration-tests
            - build-docker-image
            - elixir-1.20.4-otp-29.0.6
          filters: *all_tags

      - gh-pages-deploy:
          requires:
            - pre-build
          filters:
            tags:
              only: /^\d+\.\d+\.\d+([a-z0-9\-\+\.])*/
            branches:
              ignore: gh-pages
